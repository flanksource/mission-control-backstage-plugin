app:
  title: Mission Control Backstage Demo
  baseUrl: http://localhost:3000

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    frame-src: ["'self'", 'https://demo.flanksource.com']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection: postgres://moshe@localhost/backstage?sslmode=disable
  auth:
    dangerouslyDisableDefaultAuthPolicy: true

auth:
  providers:
    guest:
      dangerouslyAllowOutsideAccess: true

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Group, User]
  locations:
    - type: file
      target: ../../catalog/k8s-workloads.yaml
    - type: file
      target: ../../catalog/cloud-resources.yaml
    - type: file
      target: ../../catalog/unannotated.yaml

missionControl:
  baseUrl: https://demo.flanksource.com
  auth:
    method: static-token
    apiToken: ${MC_API_TOKEN}

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods: []
